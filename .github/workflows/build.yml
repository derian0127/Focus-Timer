name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Dependencias de Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Icono de macOS
        if: matrix.os == 'macos-latest'
        run: npx tauri icon design/app-icon.png --output src-tauri/icons-gen

      - name: Copiar icon.icns
        if: matrix.os == 'macos-latest'
        run: cp src-tauri/icons-gen/icon.icns src-tauri/icons/icon.icns

      - run: npm test

      - name: Pruebas de Rust
        if: matrix.os != 'macos-latest'
        run: cargo test --workspace

      - run: npm run app:build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: focus-timer-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(target/release/bundle/nsis/*.exe target/release/bundle/deb/*.deb \
                 target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage \
                 target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
